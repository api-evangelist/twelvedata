aid: twelvedata
url: https://raw.githubusercontent.com/api-evangelist/twelvedata/refs/heads/main/apis.yml
name: Twelve Data
kind: company
description: Twelve Data is a financial market data provider offering real-time and
  historical data for stocks, forex, cryptocurrencies, ETFs, indices, commodities,
  and funds through a single REST API and a real-time WebSocket. Coverage spans
  time series (OHLCV), quotes and prices, 100-plus technical indicators, reference
  and catalog data, and company fundamentals. Every request is authenticated with
  an apikey and metered as API credits; a free Basic plan grants 800 API credits
  per day. Real-time price streaming is delivered over a WebSocket at
  wss://ws.twelvedata.com/v1/quotes/price.
