    type: AsyncAPI
  description: Real-time price streaming over a persistent, bidirectional WebSocket
    at wss://ws.twelvedata.com/v1/quotes/price. Clients authenticate with an apikey
    query parameter, send JSON subscribe / unsubscribe / reset control messages, and
    receive pushed price events (roughly 170ms average latency), subscribe-status
    acknowledgements, and heartbeats.
