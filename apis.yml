- aid: twelvedata:twelvedata-websocket-streaming-api
  name: Twelve Data WebSocket Streaming API
  tags:
  - Real-Time Data
  - WebSocket
  - Streaming
  - Market Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://twelvedata.com/docs/websocket/ws-real-time-price
  baseURL: wss://ws.twelvedata.com/v1/quotes/price
  properties:
  - url: https://twelvedata.com/docs/websocket/ws-real-time-price
    type: Documentation
  - url: asyncapi/twelvedata-asyncapi.yml
    type: AsyncAPI
  description: >-
    Real-time price streaming over a persistent, bidirectional WebSocket at wss://ws.twelvedata.com/v1/quotes/price.
    Clients authenticate with an apikey query parameter, send JSON subscribe / unsubscribe / reset control
    messages, and receive pushed price events (roughly 170ms average latency), subscribe-status acknowledgements,
    and heartbeats.
