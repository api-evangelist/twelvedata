meters:
- name: plan_subscription
  description: Fixed monthly subscription fee for the selected plan (Grow, Pro, Ultra).
  unit: subscription
  aggregation: max
  dimensions:
  - account
  - plan
- name: api_credits
  description: Weighted API credits consumed per REST request; metered against the per-minute quota.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: websocket_credits
  description: WebSocket credits consumed, one per successfully subscribed symbol on the real-time price stream.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - symbol
principles:
- name: Visibility
  description: Track API credit burn per endpoint and WebSocket credit use per symbol against the plan ceiling.
- name: Allocation
  description: Use separate API keys per workload or team to attribute credit consumption to cost centers.
- name: Optimization
  description: Choose the smallest plan that covers required markets and credit ceilings; use batch requests and cache reference data to conserve credits; unsubscribe idle WebSocket symbols.
- name: Accountability
  description: Assign an owner per API key; review monthly whether the plan tier still matches credit demand.
