description: >-
  FinOps view of Twelve Data spend. Twelve Data bills a fixed monthly
  subscription per plan (Basic free, Grow, Pro, Ultra) plus Enterprise
  agreements. Consumption is governed by a credit system: each REST endpoint has
  a data weight in API credits with a per-minute quota that resets each minute,
  and the WebSocket stream consumes 1 credit per subscribed symbol from a
  separate WebSocket credit pool. Cost is therefore driven by plan selection and
  by staying within the plan's credit ceilings rather than by pure per-call
  metering.
notes: >-
  Subscription prices and credit ceilings change; annual billing is discounted.
  Verify against the Twelve Data pricing page during reconciliation.
