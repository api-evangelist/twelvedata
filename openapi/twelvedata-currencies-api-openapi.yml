openapi: 3.2.0
info:
  description: '## Overview


    Welcome to Twelve Data developer docs — your gateway to comprehensive financial market data through a powerful and easy-to-use API.'
  title: Twelve Data Currencies API
  version: 0.0.1
servers:
- url: https://api.twelvedata.com/
security:
- authorizationHeader:
  - '[]'
- queryParameter:
  - '[]'
tags:
- name: Currencies
paths:
  /currency_conversion:
    get:
      description: The currency conversion endpoint provides real-time exchange rates and calculates the converted amount for specified currency pairs, including both forex and cryptocurrencies. This endpoint is useful for obtaining up-to-date conversion values between two currencies, facilitating tasks such as financial reporting, e-commerce transactions, and travel budgeting.
      operationId: GetCurrencyConversion
      parameters:
      - description: The currency pair you want to request can be either forex or cryptocurrency. Slash(`/`) delimiter is used. E.g. `EUR/USD` or `BTC/ETH` will be correct
        in: query
        name: symbol
        required: true
        schema:
          type: string
          x-go-name: Symbol
          x-order: '10'
        x-go-name: Symbol
        x-order: '10'
        example: EUR/USD
      - description: Amount of base currency to be converted into quote currency. Supports values in the range from `0` and above
        in: query
        name: amount
        required: true
        schema:
          format: double
          type: number
          x-go-name: Amount
          x-order: '20'
        x-go-name: Amount
        x-order: '20'
        example: '100'
      - description: If not null, will use exchange rate from a specific date or time. Format `2006-01-02` or `2006-01-02T15:04:05`. Is set in the local exchange time zone, use timezone parameter to specify a specific time zone
        in: query
        name: date
        schema:
          type: string
          x-go-name: Date
          x-order: '30'
        x-go-name: Date
        x-order: '30'
        example: '2006-01-02T15:04:05'
      - description: Value can be `JSON` or `CSV`. Default `JSON`
        in: query
        name: format
        schema:
          $ref: '#/components/schemas/FormatEnum'
        x-go-name: Format
        x-order: '40'
      - description: Specify the delimiter used when downloading the `CSV` file. Default semicolon `;`
        in: query
        name: delimiter
        schema:
          default: ;
          type: string
          x-go-name: Delimiter
          x-order: '50'
        x-go-name: Delimiter
        x-order: '50'
      - description: The number of decimal places for the data
        in: query
        name: dp
        schema:
          default: 5
          format: int64
          type: integer
          x-go-name: DecimalPlaces
          x-order: '60'
        x-go-name: DecimalPlaces
        x-order: '60'
      - description: 'Timezone at which output datetime will be displayed. Supports:

          <ul>

          <li>1. <code>Exchange</code> for local exchange time</li>

          <li>2. <code>UTC</code> for datetime at universal UTC standard</li>

          <li>3. Timezone name according to the IANA Time Zone Database. E.g. <code>America/New_York</code>, <code>Asia/Singapore</code>. Full list of timezones can be found <a href="https://en.wikipedia.org/wiki/List_of_tz_database_time_zones" target="blank">here</a>.</li>

          </ul>

          <i>Take note that the IANA Timezone name is case-sensitive</i>'
        in: query
        name: timezone
        schema:
          type: string
          x-go-name: Timezone
          x-order: '60'
        x-go-name: Timezone
        x-order: '60'
        example: UTC
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCurrencyConversion_200_response'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBadRequestErrorResponseBody'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUnauthorizedErrorResponseBody'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiForbiddenErrorResponseBody'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiNotFoundErrorResponseBody'
          description: ''
        '414':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiParameterTooLongErrorResponseBody'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTooManyRequestsErrorResponseBody'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInternalServerErrorResponseBody'
          description: ''
      summary: Currency conversion
      tags:
      - Currencies
      x-api-credits-cost: '1'
      x-api-credits-type: symbol
      x-badge: Useful
      x-group: Currencies
      x-order: '20'
  /exchange_rate:
    get:
      description: The exchange rate endpoint provides real-time exchange rates for specified currency pairs, including both forex and cryptocurrency. It returns the current exchange rate value between two currencies, allowing users to quickly access up-to-date conversion rates for financial transactions or market analysis.
      operationId: GetExchangeRate
      parameters:
      - description: The currency pair you want to request can be either forex or cryptocurrency. Slash(`/`) delimiter is used. E.g. `EUR/USD` or `BTC/ETH` will be correct
        in: query
        name: symbol
        required: true
        schema:
          type: string
          x-go-name: Symbol
          x-order: '10'
        x-go-name: Symbol
        x-order: '10'
        example: EUR/USD
      - description: If not null, will use exchange rate from a specific date or time. Format `2006-01-02` or `2006-01-02T15:04:05`. Is set in the local exchange time zone, use timezone parameter to specify a specific time zone
        in: query
        name: date
        schema:
          type: string
          x-go-name: Date
          x-order: '20'
        x-go-name: Date
        x-order: '20'
        example: '2006-01-02T15:04:05'
      - description: Value can be `JSON` or `CSV`. Default `JSON`
        in: query
        name: format
        schema:
          $ref: '#/components/schemas/FormatEnum'
        x-go-name: Format
        x-order: '30'
      - description: Specify the delimiter used when downloading the `CSV` file. Default semicolon `;`
        in: query
        name: delimiter
        schema:
          default: ;
          type: string
          x-go-name: Delimiter
          x-order: '40'
        x-go-name: Delimiter
        x-order: '40'
      - description: The number of decimal places for the data
        in: query
        name: dp
        schema:
          default: 5
          format: int64
          type: integer
          x-go-name: DecimalPlaces
          x-order: '50'
        x-go-name: DecimalPlaces
        x-order: '50'
      - description: 'Timezone at which output datetime will be displayed. Supports:

          <ul>

          <li>1. <code>Exchange</code> for local exchange time</li>

          <li>2. <code>UTC</code> for datetime at universal UTC standard</li>

          <li>3. Timezone name according to the IANA Time Zone Database. E.g. <code>America/New_York</code>, <code>Asia/Singapore</code>. Full list of timezones can be found <a href="https://en.wikipedia.org/wiki/List_of_tz_database_time_zones" target="blank">here</a>.</li>

          </ul>

          <i>Take note that the IANA Timezone name is case-sensitive</i>'
        in: query
        name: timezone
        schema:
          type: string
          x-go-name: Timezone
          x-order: '60'
        x-go-name: Timezone
        x-order: '60'
        example: UTC
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExchangeRate_200_response'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBadRequestErrorResponseBody'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUnauthorizedErrorResponseBody'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiForbiddenErrorResponseBody'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiNotFoundErrorResponseBody'
          description: ''
        '414':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiParameterTooLongErrorResponseBody'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTooManyRequestsErrorResponseBody'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInternalServerErrorResponseBody'
          description: ''
      summary: Exchange rate
      tags:
      - Currencies
      x-api-credits-cost: '1'
      x-api-credits-type: symbol
      x-group: Currencies
      x-order: '10'
components:
  schemas:
    GetExchangeRate_200_response:
      properties:
        symbol:
          description: Requested currency symbol
          examples:
          - USD/JPY
          type: string
          x-go-name: Symbol
          x-order: 10
        rate:
          description: Real-time exchange rate for the corresponding symbol
          examples:
          - 105.12
          format: double
          type: number
          x-go-name: Rate
          x-order: 20
        timestamp:
          description: Unix timestamp of the rate
          examples:
          - 1602714051
          format: int64
          type: integer
          x-go-name: Timestamp
          x-order: 30
      required:
      - rate
      - symbol
      - timestamp
      type: object
    GetCurrencyConversion_200_response:
      properties:
        symbol:
          description: Requested currency symbol
          examples:
          - USD/JPY
          type: string
          x-go-name: Symbol
          x-order: 10
        rate:
          description: Real-time exchange rate for the corresponding symbol
          examples:
          - 105.12
          format: double
          type: number
          x-go-name: Rate
          x-order: 20
        amount:
          description: Amount of converted currency
          examples:
          - 12824.64
          format: double
          type: number
          x-go-name: Amount
          x-order: 30
        timestamp:
          description: Unix timestamp of the rate
          examples:
          - 1602714051
          format: int64
          type: integer
          x-go-name: Timestamp
          x-order: 40
      required:
      - rate
      - symbol
      - timestamp
      type: object
    ApiForbiddenErrorResponseBody:
      properties:
        code:
          description: Error code
          examples:
          - 403
          format: int64
          type: integer
          x-go-name: Code
        message:
          description: Error message
          examples:
          - API key lacks permissions for the requested resource
          type: string
          x-go-name: Message
        status:
          description: Error status
          examples:
          - error
          type: string
