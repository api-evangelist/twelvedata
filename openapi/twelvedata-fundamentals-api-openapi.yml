openapi: 3.2.0
info:
  title: Twelvedata Fundamentals API
  version: '1.0'
  description: 'Operations tagged fundamentals across 2 of this provider''s published API definitions: twelvedata-openapi-original.json, twelvedata-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.twelvedata.com/
- url: https://api.twelvedata.com
  description: Twelve Data REST base URL
tags:
- name: Fundamentals
paths:
  /balance_sheet:
    get:
      description: The balance sheet endpoint provides a detailed financial statement for a company, outlining its assets, liabilities, and shareholders' equity. This endpoint returns structured data that includes current and non-current assets, total liabilities, and equity figures, enabling users to assess a company's financial health and stability.
      operationId: GetBalanceSheet
      parameters:
      - description: 'Symbol ticker of instrument.

          For preferred stocks use dot(.) delimiter.

          E.g. `BRK.A` or `BRK.B` will be correct'
        in: query
        name: symbol
        schema:
          type: string
          x-go-name: Symbol
          x-order: '10'
          x-required-group: symbol
        x-go-name: Symbol
        x-order: '10'
        x-required-group: symbol
        example: AAPL
      - description: Filter by financial instrument global identifier (FIGI). This parameter is available on the <a href="https://twelvedata.com/pricing">Ultra</a> plan (individual) and the <a href="https://twelvedata.com/pricing-business">Enterprise</a> plan (business) and above.
        in: query
        name: figi
        schema:
          type: string
          x-go-name: Figi
          x-order: '20'
          x-required-group: symbol
        x-go-name: Figi
        x-order: '20'
        x-required-group: symbol
        example: BBG000B9Y5X2
      - description: Filter by international securities identification number (ISIN). ISIN access is activating in the <a href="https://twelvedata.com/account/add-ons">Data add-ons</a> section
        in: query
        name: isin
        schema:
          type: string
          x-go-name: Isin
          x-order: '30'
          x-required-group: symbol
        x-go-name: Isin
        x-order: '30'
        x-required-group: symbol
        example: US0378331005
      - description: The CUSIP of an instrument for which data is requested. CUSIP access is activating in the <a href="https://twelvedata.com/account/add-ons">Data add-ons</a> section
        in: query
        name: cusip
        schema:
          type: string
          x-go-name: Cusip
          x-order: '32'
          x-required-group: symbol
        x-go-name: Cusip
        x-order: '32'
        x-required-group: symbol
        example: '594918104'
      - description: Exchange where instrument is traded
        in: query
        name: exchange
        schema:
          type: string
          x-go-name: Exchange
          x-order: '40'
        x-go-name: Exchange
        x-order: '40'
        example: NASDAQ
      - description: Market Identifier Code (MIC) under ISO 10383 standard
        in: query
        name: mic_code
        schema:
          type: string
          x-go-name: MicCode
          x-order: '50'
        x-go-name: MicCode
        x-order: '50'
        example: XNAS
      - description: Country where instrument is traded, e.g., `United States` or `US`
        in: query
        name: country
        schema:
          type: string
          x-go-name: Country
          x-order: '60'
        x-go-name: Country
        x-order: '60'
        example: United States
      - description: The reporting period for the balance sheet data
        in: query
        name: period
        schema:
          $ref: '#/components/schemas/PeriodEnum'
        x-go-name: Period
        x-order: '70'
      - description: 'Begin date for filtering items by fiscal date.

          Returns income statements with fiscal dates on or after this date. Format `2006-01-02`'
        in: query
        name: start_date
        schema:
          type: string
          x-go-name: StartDate
          x-order: '80'
        x-go-name: StartDate
        x-order: '80'
        example: '2024-01-01'
      - description: 'End date for filtering items by fiscal date.

          Returns income statements with fiscal dates on or before this date. Format `2006-01-02`'
        in: query
        name: end_date
        schema:
          type: string
          x-go-name: EndDate
          x-order: '90'
        x-go-name: EndDate
        x-order: '90'
        example: '2024-05-01'
      - description: Number of records in response
        in: query
        name: outputsize
        schema:
          default: 6
          format: int64
          type: integer
          x-go-name: OutputSize
          x-order: '100'
        x-go-name: OutputSize
        x-order: '100'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBalanceSheet_200_response'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBadRequestErrorResponseBody'
          description: ''
        '401':
