          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTooManyRequestsErrorResponseBody'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInternalServerErrorResponseBody'
          description: ''
      summary: Balance sheet
      tags:
      - Fundamentals
      x-additional-notes: This API endpoint is available on the Pro plan (individual) and the Venture plan (business) and above. Full access to historical data requires the Ultra plan (individual) or the Enterprise plan (business).
