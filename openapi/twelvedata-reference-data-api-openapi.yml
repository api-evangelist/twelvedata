          </p>

          The date can be specified in one of the following formats:

          <ul>

          <li>An exact date (e.g., <code>2021-10-27</code>)</li>

          <li>A human-readable keyword: <code>today</code> or <code>yesterday</code></li>

          <li>A full datetime string in UTC (e.g., <code>2025-04-11T20:00:00</code>) to retrieve the schedule corresponding to the day in the specified time.</li>

          </ul>

          When using a datetime value, the resulting schedule will correspond to the local calendar day at the specified time.

          For example, <code>2025-04-11T20:00:00 UTC</code> corresponds to:

          <ul>

          <li><code>2025-04-11</code> in the <code>America/New_York</code> timezone</li>

