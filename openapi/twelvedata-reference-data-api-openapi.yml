openapi: 3.2.0
info:
  title: Twelvedata Reference Data API
  version: '1.0'
  description: 'Operations tagged reference_data across 2 of this provider''s published API definitions: twelvedata-openapi-original.json, twelvedata-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.twelvedata.com/
- url: https://api.twelvedata.com
  description: Twelve Data REST base URL
tags:
- name: Reference Data
paths:
  /bonds:
    get:
      description: The fixed income endpoint provides a daily updated list of available bonds. It returns an array containing detailed information about each bond, including identifiers, names, and other relevant attributes.
      operationId: GetBonds
      parameters:
      - description: The ticker symbol of an instrument for which data is requested
        in: query
        name: symbol
        schema:
          type: string
          x-go-name: Symbol
        x-go-name: Symbol
        example: US2Y
      - description: Filter by exchange name
        in: query
        name: exchange
        schema:
          type: string
          x-go-name: Exchange
        x-go-name: Exchange
        example: NYSE
      - description: Filter by country name or alpha code, e.g., `United States` or `US`
        in: query
        name: country
        schema:
          type: string
          x-go-name: Country
        x-go-name: Country
        example: United States
      - description: The format of the response data
        in: query
        name: format
        schema:
          $ref: '#/components/schemas/FormatEnum'
        x-go-name: Format
      - description: The separator used in the CSV response data
        in: query
        name: delimiter
        schema:
          default: ;
          type: string
          x-go-name: Delimiter
        x-go-name: Delimiter
      - description: Adds info on which plan symbol is available
        in: query
        name: show_plan
        schema:
          default: false
          type: boolean
          x-go-name: ShowPlan
        x-go-name: ShowPlan
      - description: Page number of the results to fetch
        in: query
        name: page
        schema:
          default: 1
          format: int64
          type: integer
          x-go-name: Page
        x-go-name: Page
      - description: Determines the number of data points returned in the output
        in: query
        name: outputsize
        schema:
          default: 5000
          format: int64
          type: integer
          x-go-name: PageSize
        x-go-name: PageSize
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBonds_200_response'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBadRequestErrorResponseBody'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUnauthorizedErrorResponseBody'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiForbiddenErrorResponseBody'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiNotFoundErrorResponseBody'
          description: ''
        '414':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiParameterTooLongErrorResponseBody'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTooManyRequestsErrorResponseBody'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInternalServerErrorResponseBody'
          description: ''
      summary: Fixed income
      tags:
      - Reference Data
      x-api-credits-cost: '1'
      x-api-credits-type: request
      x-group: Reference data/Asset catalogs
      x-order: '70'
      x-url-hash: bonds-list
      security:
      - authorizationHeader:
        - '[]'
      - queryParameter:
        - '[]'
    servers:
    - url: https://api.twelvedata.com/
  /commodities:
    get:
      description: The commodities endpoint provides a daily updated list of available commodity pairs, across precious metals, livestock, softs, grains, etc.
      operationId: GetCommodities
      parameters:
      - description: The ticker symbol of an instrument for which data is requested
        in: query
        name: symbol
        schema:
          type: string
          x-go-name: Symbol
          x-order: '10'
        x-go-name: Symbol
        x-order: '10'
        example: XAU/USD
      - description: Filter by category of commodity
        in: query
        name: category
        schema:
          type: string
          x-go-name: Category
          x-order: '20'
        x-go-name: Category
        x-order: '20'
        example: Precious Metal
      - description: The format of the response data
        in: query
        name: format
        schema:
          $ref: '#/components/schemas/FormatEnum'
        x-go-name: Format
        x-order: '30'
      - description: The separator used in the CSV response data
        in: query
        name: delimiter
        schema:
          default: ;
          type: string
          x-go-name: Delimiter
          x-order: '40'
        x-go-name: Delimiter
        x-order: '40'
      - description: Page number of the results to fetch
        in: query
        name: page
        schema:
          default: 1
          format: int64
          type: integer
          x-go-name: Page
          x-order: '50'
        x-go-name: Page
        x-order: '50'
      - description: Determines the number of data points returned in the output
        in: query
        name: outputsize
        schema:
          format: int64
          type: integer
          x-go-name: PageSize
          x-order: '60'
        x-go-name: PageSize
        x-order: '60'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCommodities_200_response'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBadRequestErrorResponseBody'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUnauthorizedErrorResponseBody'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiForbiddenErrorResponseBody'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiNotFoundErrorResponseBody'
          description: ''
        '414':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiParameterTooLongErrorResponseBody'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTooManyRequestsErrorResponseBody'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInternalServerErrorResponseBody'
          description: ''
      summary: Commodities
      tags:
      - Reference Data
      x-api-credits-cost: '1'
      x-api-credits-type: request
      x-group: Reference data/Asset catalogs
      x-order: '60'
      x-url-hash: commodities-list
      security:
      - authorizationHeader:
        - '[]'
      - queryParameter:
        - '[]'
    servers:
    - url: https://api.twelvedata.com/
  /countries:
    get:
      description: The countries endpoint provides a comprehensive list of countries, including their ISO codes, official names, capitals, and currencies. This data is essential for applications requiring accurate country information for tasks such as localization, currency conversion, or geographic analysis.
      operationId: GetCountries
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCountries_200_response'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBadRequestErrorResponseBody'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUnauthorizedErrorResponseBody'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiForbiddenErrorResponseBody'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiNotFoundErrorResponseBody'
          description: ''
        '414':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiParameterTooLongErrorResponseBody'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTooManyRequestsErrorResponseBody'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInternalServerErrorResponseBody'
          description: ''
      summary: Countries
      tags:
      - Reference Data
      x-api-credits-cost: '1'
      x-api-credits-type: request
      x-group: Reference data/Supporting metadata
      x-order: '10'
      x-url-hash: countries
      security:
      - authorizationHeader:
        - '[]'
      - queryParameter:
        - '[]'
    servers:
    - url: https://api.twelvedata.com/
  /cross_listings:
    get:
      description: The cross_listings endpoint provides a daily updated list of cross-listed symbols for a specified financial instrument. Cross-listed symbols represent the same security available on multiple exchanges. This endpoint is useful for identifying all the exchanges where a particular security is traded, allowing users to access comprehensive trading information across different markets.
      operationId: GetCrossListings
      parameters:
      - description: The ticker symbol of an instrument for which data is requested
        in: query
        name: symbol
        required: true
        schema:
          type: string
          x-go-name: Symbol
          x-order: '10'
        x-go-name: Symbol
        x-order: '10'
        example: AAPL
      - description: Exchange where instrument is traded
        in: query
        name: exchange
        schema:
          type: string
          x-go-name: Exchange
          x-order: '20'
        x-go-name: Exchange
        x-order: '20'
        example: NASDAQ
      - description: Market identifier code (MIC) under ISO 10383 standard
        in: query
        name: mic_code
        schema:
          type: string
          x-go-name: MicCode
          x-order: '30'
        x-go-name: MicCode
        x-order: '30'
        example: XNGS
      - description: Country to which stock exchange belongs to
        in: query
        name: country
        schema:
          type: string
          x-go-name: Country
          x-order: '40'
        x-go-name: Country
        x-order: '40'
        example: United States
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCrossListings_200_response'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBadRequestErrorResponseBody'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUnauthorizedErrorResponseBody'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiForbiddenErrorResponseBody'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiNotFoundErrorResponseBody'
          description: ''
        '414':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiParameterTooLongErrorResponseBody'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTooManyRequestsErrorResponseBody'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInternalServerErrorResponseBody'
          description: ''
      summary: Cross listings
      tags:
      - Reference Data
      x-api-credits-cost: '40'
      x-api-credits-type: request
      x-group: Reference data/Discovery
      x-order: '20'
      x-starting-plan: grow,venture
      x-url-hash: cross-listings
      security:
      - authorizationHeader:
        - '[]'
      - queryParameter:
        - '[]'
    servers:
    - url: https://api.twelvedata.com/
  /cryptocurrencies:
    get:
      description: The cryptocurrencies endpoint provides a daily updated list of all available cryptos. It returns an array containing detailed information about each cryptocurrency, including its symbol, name, and other relevant identifiers. This endpoint is useful for retrieving a comprehensive catalog of cryptocurrencies for applications that require up-to-date market listings or need to display available crypto assets to users.
      operationId: GetCryptocurrencies
      parameters:
      - description: The ticker symbol of an instrument for which data is requested
        in: query
        name: symbol
        schema:
          type: string
          x-go-name: Symbol
        x-go-name: Symbol
        example: BTC/USD
      - description: Filter by exchange name. E.g. `Binance`, `Coinbase`, etc.
        in: query
        name: exchange
        schema:
          type: string
          x-go-name: Exchange
        x-go-name: Exchange
        example: Binance
      - description: Filter by currency base
        in: query
        name: currency_base
        schema:
          type: string
          x-go-name: CurrencyBase
        x-go-name: CurrencyBase
        example: BTC
      - description: Filter by currency quote
        in: query
        name: currency_quote
        schema:
          type: string
          x-go-name: CurrencyQuote
        x-go-name: CurrencyQuote
        example: USD
      - description: The format of the response data
        in: query
        name: format
        schema:
          $ref: '#/components/schemas/FormatEnum'
        x-go-name: Format
      - description: The separator used in the CSV response data
        in: query
        name: delimiter
        schema:
          default: ;
          type: string
          x-go-name: Delimiter
        x-go-name: Delimiter
      - description: Page number of the results to fetch
        in: query
        name: page
        schema:
          default: 1
          format: int64
          type: integer
          x-go-name: Page
        x-go-name: Page
      - description: Determines the number of data points returned in the output
        in: query
        name: outputsize
        schema:
          format: int64
          type: integer
          x-go-name: PageSize
        x-go-name: PageSize
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCryptocurrencies_200_response'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBadRequestErrorResponseBody'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUnauthorizedErrorResponseBody'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiForbiddenErrorResponseBody'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiNotFoundErrorResponseBody'
          description: ''
        '414':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiParameterTooLongErrorResponseBody'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTooManyRequestsErrorResponseBody'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInternalServerErrorResponseBody'
          description: ''
      summary: Cryptocurrency pairs
      tags:
      - Reference Data
      x-api-credits-cost: '1'
      x-api-credits-type: request
      x-group: Reference data/Asset catalogs
      x-order: '30'
      x-url-hash: cryptocurrencies-list
      security:
      - authorizationHeader:
        - '[]'
      - queryParameter:
        - '[]'
    servers:
    - url: https://api.twelvedata.com/
  /cryptocurrency_exchanges:
    get:
      description: The cryptocurrency exchanges endpoint provides a daily updated list of available cryptocurrency exchanges. It returns an array containing details about each exchange, such as exchange names and identifiers.
      operationId: GetCryptocurrencyExchanges
      parameters:
      - description: The format of the response data
        in: query
        name: format
        schema:
          $ref: '#/components/schemas/FormatEnum'
        x-go-name: Format
        x-order: '10'
      - description: Specify the delimiter used when downloading the CSV file
        in: query
        name: delimiter
        schema:
          default: ;
          type: string
          x-go-name: Delimiter
          x-order: '20'
        x-go-name: Delimiter
        x-order: '20'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCryptocurrencyExchanges_200_response'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBadRequestErrorResponseBody'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUnauthorizedErrorResponseBody'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiForbiddenErrorResponseBody'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiNotFoundErrorResponseBody'
          description: ''
        '414':
