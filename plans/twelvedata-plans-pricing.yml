    Free plan with 8 API credits per minute and 800 API credits per day covering
    real-time US equities and ETFs, forex, and crypto, plus reference data and
    technical indicators. Includes a small WebSocket trial allotment.
  entries:
  - label: API Credits Per Minute
    name: api_credits_per_minute
    type: rate_limit
    metric: credits
    limit: 8
    timeFrame: minute
    geo: global
    unit: 1
    price: '0'
    userMultiplied: false
  - label: API Credits Per Day
    name: api_credits_per_day
    type: quota
    metric: credits
    limit: 800
    timeFrame: day
    geo: global
    unit: 1
    price: '0'
    userMultiplied: false
  - label: WebSocket Credits
