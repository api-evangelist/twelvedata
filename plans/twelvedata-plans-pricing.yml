specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Twelve Data
providerId: twelvedata
created: '2026-07-11'
modified: '2026-07-11'
reconciled: true
tags:
- Market Data
- Financial Data
- Stocks
- Forex
- Crypto
- Real-Time Data
- Plans
description: >-
  Twelve Data uses a credit-metered subscription model. Every API endpoint has a
  data weight that determines how many API credits a request consumes, and the
  per-minute credit quota resets each minute. The free Basic plan grants 8 API
  credits per minute and 800 per day. Paid Grow, Pro, and Ultra plans raise the
  per-minute credit ceiling, remove the daily cap, add markets, real-time
  exchange coverage, fundamentals, and larger WebSocket credit pools. WebSocket
  streaming is metered separately (1 WebSocket credit per subscribed symbol).
  Enterprise adds compliance, dedicated support, and higher SLAs.
notes: >-
  Prices and credit ceilings are as published on the Twelve Data pricing page
  and are subject to change; annual billing is discounted. Verify current
  numbers on the pricing page during reconciliation. Startups and students may
  qualify for a 20 percent discount and non-profits for free access.
sources:
- https://twelvedata.com/pricing
- https://twelvedata.com/pricing-business
- https://support.twelvedata.com/en/articles/5615854-credits
plans:
