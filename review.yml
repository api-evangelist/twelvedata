aid: twelvedata
name: Twelve Data
review:
  question: Does Twelve Data expose a documented public WebSocket API?
  answer: true
  date: '2026-07-11'
  reviewer: API Evangelist
  asyncapiSpecCreated: true
  asyncapiScopeNote: |
    Twelve Data documents a genuine, bidirectional public WebSocket API for
    real-time price streaming. An AsyncAPI 2.6 document was authored at
    asyncapi/twelvedata-asyncapi.yml modeling the wss://ws.twelvedata.com/v1/quotes/price
    channel: the client-to-server control messages (subscribe / unsubscribe /
    reset) and the server-to-client events (price, subscribe-status, heartbeat).
    This is a real WebSocket transport (wss://), not HTTP Server-Sent Events.
findings:
  summary: |
    Twelve Data publishes a documented public WebSocket API in addition to its
    REST API. The REST API (base https://api.twelvedata.com) covers time series
    (OHLCV), quotes and prices, 100-plus technical indicators, reference /
    catalog data, and company fundamentals, all authenticated with an apikey
    supplied as a query parameter (?apikey=) or via the
    `Authorization: apikey <KEY>` header, and metered as API credits. Separately,
    Twelve Data operates a real-time price WebSocket at
    wss://ws.twelvedata.com/v1/quotes/price. The client authenticates with the
    apikey query parameter, opens a persistent connection, and sends JSON control
    messages ({"action":"subscribe","params":{"symbols":"AAPL,EUR/USD,BTC/USD"}},
    plus unsubscribe and reset). The server pushes `price` events (fields include
    event, symbol, currency, exchange, type, timestamp, price, day_volume) at
    roughly 170ms average latency, alongside `subscribe-status` acknowledgements
    and periodic `heartbeat` events. WebSocket usage is metered separately from
    REST credits: 1 WebSocket credit per successfully subscribed symbol.
  accessModel: |
    Public, self-service, key-based access. Anyone can register for a free
    Basic plan (8 API credits/minute, 800 API credits/day, WebSocket on a small
    trial allotment) and upgrade to paid Grow, Pro, Ultra, or Enterprise plans
    for higher credit ceilings, more markets, real-time exchange coverage,
    fundamentals, and larger WebSocket credit pools.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.twelvedata.com
      documented: true
      note: Time series, quotes/price, technical indicators, reference data, fundamentals. apikey query param or Authorization header.
    - protocol: WebSocket
      scheme: wss
      baseURL: wss://ws.twelvedata.com/v1/quotes/price
      documented: true
      note: Real-time price streaming. Persistent bidirectional connection; JSON subscribe/unsubscribe/reset control messages; server pushes price, subscribe-status, and heartbeat events.
